# Two networks: the IPv4 default-route interface serves published ports; the other is bridged to the guest.
# Requires Docker Compose 2.33.1+ for gw_priority, which pins default as the uplink.
# One network is enough for WebFig/SSH/API; the second adds direct guest networking.
services:

  routeros:
    # Latest image
    image: evilfreelancer/docker-routeros:latest
    # or exact same version
    #image: evilfreelancer/docker-routeros:7.20.8
    # or minor version
    #image: evilfreelancer/docker-routeros:7.20
    # or major version
    #image: evilfreelancer/docker-routeros:7
    # or build from sources
    #build:
    #  context: .
    #  dockerfile: Dockerfile
    #  args:
    #    - ROUTEROS_VERSION=7.20.8
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
      - /dev/kvm
    ports:
      - "127.0.0.1:8080:80" # WebFig; use an SSH tunnel for remote VPS access
      - "2222:22"
      - "2223:23"
      - "8728:8728"
      - "8729:8729"
    volumes:
      - ./routeros_data:/data
    networks:
      default:
        gw_priority: 1
      routeros_net: {}

networks:
  routeros_net:
    driver: bridge
